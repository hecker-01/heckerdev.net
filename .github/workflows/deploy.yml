name: build to branch production

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout master
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install & build
              run: |
                  npm ci
                  npm run build

            - name: Prepare for SPA hosting
              run: |
                  cp build/index.html build/404.html
                  echo "ErrorDocument 404 /index.html" > build/.htaccess

            - name: deploy
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: build
                  branch: production
